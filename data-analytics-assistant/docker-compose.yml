version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: analytics_postgres
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_user -d analytics_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: analytics_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://analytics_user:analytics_pass@postgres:5432/analytics_db
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./uploads:/app/uploads
    command: streamlit run app/ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0

volumes:
  postgres_data:
