services:
  db:
    image: pgvector/pgvector:pg16
    container_name: automark_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: automark
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./CRM/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  crm:
    build: .
    container_name: automark_crm
    restart: unless-stopped
    working_dir: /app/CRM
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://postgres:postgres@db:5432/automark
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./CRM/uploads:/app/CRM/uploads
      - ./CRM/knowledge_base:/app/CRM/knowledge_base

  analytics:
    build: .
    container_name: automark_analytics
    restart: unless-stopped
    command: ["streamlit", "run", "Data Analytics/app/ui/streamlit_app.py",
              "--server.port=8501", "--server.address=0.0.0.0"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/automark
      DB_HOST: db
      DB_NAME: automark
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "./Data Analytics/uploads:/app/Data Analytics/uploads"

volumes:
  postgres_data:
